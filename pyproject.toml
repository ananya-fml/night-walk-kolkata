[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwalk"
version = "0.1.0"
description = "Night-time walking exposure index and route comparison for Kolkata, from open data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ananya Saha" }]
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "geopandas>=0.14",
    "shapely>=2.0", "pyproj>=3.5", "networkx>=3.0", "rasterio>=1.3",
    "requests>=2.28", "opening_hours_py>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
